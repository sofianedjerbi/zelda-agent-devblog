<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='3' y='0' width='2' height='1' fill='%23fcd8a8'/><rect x='2' y='1' width='4' height='2' fill='%23fcd8a8'/><rect x='3' y='3' width='2' height='5' fill='%23a3a3a3'/></svg>">
</head>
<body>
<header class="hud">
  <div class="hud-in">
    <a class="hud-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% assign here = page.url %}

  </div>
</header>
<main class="wrap">
  {{ content }}
</main>
<footer class="foot">Fan research project. Not affiliated with Nintendo. Original pixel art, no game files shared.</footer>
</body>
</html>
