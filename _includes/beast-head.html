{% assign b = include.b %}
<header class="beast-head">
  {% if b.type == "boss" %}
  <svg class="sprite-s" width="40" height="40" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="2" width="1" height="2" fill="#f2c230"/><rect x="4" y="1" width="2" height="3" fill="#f2c230"/><rect x="8" y="2" width="1" height="2" fill="#f2c230"/><rect x="1" y="4" width="8" height="2" fill="#f2c230"/><rect x="2" y="6" width="6" height="3" fill="#6e3f1b"/><rect x="3" y="7" width="1" height="1" fill="#fff8e1"/><rect x="6" y="7" width="1" height="1" fill="#fff8e1"/></svg>
  {% elsif b.type == "egg" %}
  <svg class="sprite-s" width="40" height="40" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="1" width="2" height="1" fill="#fff8e1"/><rect x="3" y="2" width="4" height="1" fill="#fff8e1"/><rect x="2" y="3" width="6" height="5" fill="#fff8e1"/><rect x="3" y="8" width="4" height="1" fill="#fff8e1"/><rect x="4" y="4" width="1" height="1" fill="#5dbb46"/><rect x="6" y="6" width="1" height="1" fill="#5dbb46"/><rect x="3" y="6" width="1" height="1" fill="#8fd3f4"/></svg>
  {% else %}
  <svg class="sprite-s" width="40" height="40" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="3" width="4" height="1" fill="#5dbb46"/><rect x="2" y="4" width="6" height="1" fill="#5dbb46"/><rect x="1" y="5" width="8" height="3" fill="#5dbb46"/><rect x="1" y="8" width="8" height="1" fill="#3d8f2f"/><rect x="3" y="5" width="1" height="1" fill="#2b2118"/><rect x="6" y="5" width="1" height="1" fill="#2b2118"/></svg>
  {% endif %}
  <div>
    <h2 class="beast-name">{{ b.name }}</h2>
    <div class="beast-real">{{ b.real }}</div>
  </div>
  <span class="badge {{ b.status }}">{% include status-label.html s=b.status %}</span>
</header>
