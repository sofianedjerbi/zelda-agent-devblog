{% assign b = include.b %}{% assign k = b.show.kind %}
{% if k == "video" %}
<figure class="show">
  <video src="{{ b.show.src | relative_url }}" controls muted loop playsinline preload="metadata"></video>
  <figcaption>{{ b.show.cap }}. Real game, unedited.</figcaption>
</figure>
{% elsif k == "map" %}
<figure class="show">
  <img class="pixmap" src="{{ b.show.src | relative_url }}" alt="The agent's own map of a room above the giant barrel" width="464" height="288">
  <figcaption>{{ b.show.cap }}</figcaption>
  <div class="map-key"><span><i style="background:#fcd8a8"></i>floor</span><span><i style="background:#2a2a2a"></i>wall</span><span><i style="background:#3cbcfc"></i>exit</span><span><i style="background:#d82800"></i>shut</span><span><i style="background:#008800"></i>Link</span><span><i style="background:#2038ec"></i>button</span><span><i style="background:#7a7a7a"></i>statue</span><span><i style="background:#6e3f1b"></i>barrel</span></div>
</figure>
{% elsif k == "owl" %}
<figure class="show">
  <div class="scroll">
  <table class="heat">
    <thead><tr><th>thing</th><th>push</th><th>hit</th><th>lift / talk</th><th>pull</th><th>item</th></tr></thead>
    <tbody>
      {% for row in site.data.owl %}
      <tr><td>{{ row.name }}</td>{% for p in row.p %}<td><span class="cell" style="--p: {{ p }}">{{ p | times: 100 | round }}%</span></td>{% endfor %}</tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
  <figcaption>What it learned: the chance each verb changes something, read from the live model. It found on its own that pots lift and that levers, statues and mushrooms want a pull. Locked doors ignore every verb.</figcaption>
</figure>
{% elsif k == "picks" %}
<figure class="show">
  <ol class="picks">
    {% for p in site.data.picks %}
    <li><span class="score">{{ p.s }}</span><span class="exp">{{ p.e }}</span>{% if p.r %}<span class="ok">reachable</span>{% else %}<span class="no">no path</span>{% endif %}</li>
    {% endfor %}
  </ol>
  <figcaption>Its real top candidates on the ledge above the giant barrel, after ranking. Scores mix its rules with the ranker's guesses; out-of-reach ideas wait until a path exists.</figcaption>
</figure>
{% elsif k == "record" %}
<figure class="show">
  <div class="record">
    <div class="rec-head">one entry per thing it has met</div>
    <div class="rec-row"><span>kind + first tile</span><code>statue @ 3,11</code></div>
    <div class="rec-row"><span>moves by itself</span><code>no</code></div>
    <div class="rec-row"><span>hurt me</span><code>no</code></div>
    <div class="rec-verbs">
      {% assign vs = "push,hit,lift,pull,item" | split: "," %}
      {% for v in vs %}<span class="v"><b>{{ v }}</b><small>tried · changed</small></span>{% endfor %}
    </div>
  </div>
  <figcaption>No names inside: only what Link's own tries showed. The same layout works for any game.</figcaption>
</figure>
{% elsif k == "slime" %}
<figure class="show">
  <div class="versus">
    {% for r in site.data.slime %}
    <div class="vs-row{% if r.best %} best{% endif %}"><span class="vs-name">{{ r.name }}</span><span class="vs-bar"><span class="fill" style="width: {{ r.go | times: 100.0 | divided_by: 16 }}%"></span></span><span class="vs-n">{{ r.go }}</span></div>
    {% endfor %}
  </div>
  <figcaption>Game overs in 66 held-out runs (33 puzzles x 2 seeds). Lower is better.</figcaption>
</figure>
{% endif %}
