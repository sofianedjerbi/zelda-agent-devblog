# Rules I learned the hard way. Read at every step back.
- rule: "Never train blind: check the real KPI during training, stop early if it doesn't move."
  why: "User rule. Reflex v1 trained 40 minutes on its own reward, then turned out barely better than standing still. Every training run now runs the combat test every 30k steps against 'stand still' and stops if it isn't ahead by the third check."
- rule: "Test from places the learner never started from, and never tell it in training what the test rewards."
  why: "Minish Cap's learned ranking 'won' 24 to 19 when trained with a bonus at each task's end and tested from the same six start places. Without the bonus and from ten new places: more rooms reached, the same ground covered, the same story progress, and fewer tasks solved."
- rule: "Before a big number goes on the home page, have it attacked by someone who did not produce it."
  why: "80% on never-seen dungeons was partly memorised looks (71% once every dungeon drew its own), and the Minish Cap 'win' was 5 runs on the same start places. I found neither; a read-only critic found both in two minutes."
- rule: "A practice world must not let the agent carry facts from one episode to the next, or it learns the world and not the skill."
  why: "With the same looks in every generated dungeon the agent learned a 30-line table of that simulator. A new game looks new: draw new looks every time and make it find out."
- rule: "When a third rule in a row fails, stop writing rules: give the agent the options and the outcomes and let it learn the ranking."
  why: "Carry, danger and the Minish table all failed in one evening. A network trained on what followed the agent's own choices took never-seen dungeons from 64% to 80% in five minutes."
- rule: "Judge on dungeons nobody has looked at. One dungeon solved is not a skill."
  why: "User, 13 Nov: 'I want the agent to learn how to play, not to learn what to enter to solve the dungeon.' Two days of gains all came from tracing one room of Zelda 1's first dungeon. The headline is now the share of never-seen dungeons solved (54% at the start)."
- rule: "Nothing becomes the default before its 16 full games. 'Logically right' and 'equal on scenarios' are not results."
  why: "The gap sidestep change looked right and scored the same on scenarios. In full games it cut dungeon entries from 12/16 to 9/16 and doubled the time to get there. A second pair of eyes (the fork recording the fight clip) saw it before I did."
- rule: "A fast test is only worth what it predicts in full games. Check that once before trusting it."
  why: "The fight test predicted that faster decisions halve the deaths and that dodging shots saves 14 of 53. In 16 full games both changed nothing (5.3 vs 5.1 game overs per 10k)."
- rule: "Capture one failure before writing a fix."
  why: "Screenshot + my map + the actions at one stuck moment found every real bug: knockback read as water, goals running into the next screen, walls learned while the game held Link, doors between tiles. Rules written without a capture mostly failed."
- rule: "A gain on the games I tune on is not a gain until it holds on held-out games."
  why: "Half-step: +7 places on seeds 8-23, -1.2 on seeds 100-115."
- rule: "An interval that crosses 0 is not a result."
  why: "16 games range from about 10 to 70 places. 'Best numbers' inside the noise were wrong more than once."
- rule: "Never edit code while a bench runs; bench from a frozen copy."
  why: "Pool workers start later and load the edited code: two results were void (act/_act clash, swing-in-place)."
- rule: "Two or three fixes without a measured gain: stop and change method."
  why: "10 hand-traced Minish Woods mechanics in a row, no gain; 4 frontier fixes in a row, no gain."
- rule: "Count what matters for finishing, not what is easy to count."
  why: "Screens went 26 -> 53 while dungeons stayed at 3-5 rooms and bosses at 0."
- rule: "Check what the agent really does at the start of a new screen."
  why: "Right after a scroll the map is not settled: reachability read 'no' for every exit and good routes were cut."
- rule: "One switch per idea, off by default, on only after it wins its own test."
  why: "13 navigation rules on together: 5/12 and 2/12 on two tasks; all off: 10/12 and 11/12."
- rule: "Same seed is not same run unless the hash seed is pinned."
  why: "Unpinned runs differed per seed; conclusions from 4-6 seeds were noise."
- rule: "The game-over screen can look alive."
  why: "Health refills in memory there: 59% of 'stuck' windows were the game-over menu."
- rule: "Don't hand-order drives; learn what each action leads to."
  why: "survive > heal > fight cut healing in Zelda 1, where hearts come from fighting: heals halved, low-health time x2.5."
- rule: "Check what is really switched on in each game before explaining the model."
  why: "The site said Link fights with a trained reflex; in Zelda 1 it had never been loaded."
- rule: "A learning signal must be first-time-only, and must not wipe the prior."
  why: "Log 003: 'new room' paid on every entry and the agent shuttled through doors; another version cancelled its own starting knowledge; paying for fights made it die more."
- rule: "Look at the lowest layer before the top: is the skill even switched on?"
  why: "Hours of navigation fixes were tested on a Zelda 1 agent that never fought, where healing comes from fighting."
- rule: "Reward outcomes, never the means."
  why: "Rewarding damage dealt: the reflex hit tough enemies again and again and died more (16 vs 12 game overs). Now: hearts lost/healed, game overs, and confirmed kills (once per enemy)."
- rule: "Judge a skill on short saved scenarios, confirm on full games; never the other way round."
  why: "Review: 16 chaotic full games (10 to 70 places from the same code) can't see a skill fix, and 15 ideas compared on them produce false winners."
- rule: "Other seeds of the same game are not held-out. Another game is."
  why: "Seeds 100-115 are the same Zelda 1 map with a different start delay."
- rule: "Work the next ladder row directly."
  why: "Key use sat at 0% for a day while I ran tournaments of switches."
- rule: "A test can be wrong too: trace one case before believing its number."
  why: "Two scenario 'findings' were artifacts of scenarios starting without the agent's memory. And the suite is small (9/8/5 moments): under 20 points is noise."
- rule: "Run every game on the board before saying 'general'."
  why: "First cross-game run: Minish Cap from its start 5.0 places vs 4.6 for random; A Link to the Past: the agent made zero decisions (no room map from that adapter) while random got the sword in half the games."
- rule: "In Zelda 1 dying is cheap; what counts is progress per life."
  why: "Three survival ideas (needs, retreat, keep-distance) each delayed death and each lost keys, heals or places in full games."
- rule: "Every scenario pool needs a case from the very start of the game."
  why: "All my scenarios start after the sword: a fighting rule that kept Link out of the sword cave (sword in 3 of 16 games) passed them all."
- rule: "Safety that stops progress is not a gain."
  why: "Backing off from nearby enemies halved game overs and hits, and cut dungeon entries from 69% to 13% - twice now (trained reflex, scripted kite)."
