- name: Old Tool Sage
  real: LLM thinker with tools
  type: boss
  status: defeated
  seen: Log 001
  nodes: [Room as text, Local LLM, "Tools: map, go, do, skills", Game]
  loop: measured effects of each verb
  did: Reasoned about rooms and called tools on the real game.
  weakness: Only as good as the text it got. Water drawn as walls, shifting labels.
  result: Fixed many data bugs; never moved the frontier itself.

- name: The Archivist
  real: Go-Explore with save states
  type: boss
  status: defeated
  seen: Log 001
  nodes: [Archive of saved spots, Pick a promising spot, Explore from it, New spots]
  loop: save every new place, restart from the best
  did: Reached Deepwood Shrine rooms 3 to 5. Furthest real progress at the time.
  weakness: Remembers routes through one game. Memorising, not learning.
  result: "Dropped as the main path: overfitting by design. Its saved states became the test benches."

- name: Pixel Muncher
  real: PPO on screen pixels
  type: boss
  status: defeated
  seen: Log 001
  nodes: [Screen pixels, PPO policy, Buttons]
  loop: reward from RAM (new rooms, score)
  did: Learned to walk around the overworld from raw pixels and game rewards.
  weakness: Never found a puzzle on its own. Rewards too rare.
  result: Explored, never progressed far without help.

- name: Breadcrumb Sprite
  real: Compass / route shaping
  type: monster
  status: defeated
  seen: Log 001
  nodes: [Known route, Reward for getting closer, Policy]
  did: Pulled the agent along a path toward the next goal.
  weakness: The path is a list of hardcoded positions.
  result: Rejected as hardcoding.

- name: Bored Wisp
  real: Boredom / novelty drive
  type: monster
  status: asleep
  seen: Log 001
  nodes: [What happened before, Novelty score, Penalty for repeats]
  did: Made repeating the same thing feel costly, like a bored player.
  weakness: Novelty is not progress. Switching screens counted as new.
  result: Lives on as the brain's boredom bookkeeping.

- name: Memory Slug
  real: Recurrent (LSTM) policy
  type: monster
  status: defeated
  seen: Log 001
  nodes: [View, LSTM memory, Policy]
  did: Could remember that a hit did nothing.
  weakness: Ten times slower to train. Two days for one run.
  result: Dropped before it finished.

