# Everything tried, newest phase first. status: kept / rejected / off (opt-in, no gain) / testing / dropped (whole approach).
# switch = how to turn it on/off in ~/minish-rl (ZL_<NAME>); result = measured; lesson = what not to do again.
- phase: "A network that learns by itself (from the night of Nov 13)"
  items:
    - {name: "It walks on: 3 rooms became 5, and the first dungeon was finished", status: testing, result: "two 40-minute runs from the stuck network, tested on 64 dungeons never seen. With the new eyes only: 3.5 rooms, and 1 dungeon of 64 finished, the first one ever by a network here. With the new eyes and a new room paying 3 instead of 1: 3.0, 3.2, 3.4, 3.6, 4.6, then 4.8 rooms, 45% of a dungeon, still rising when the run ended (none finished in that test). Counting where it stops now: it reaches 5.0 of 11 rooms; an open door it never took is left in 22 of 32 dungeons (30 before); and the game's own mechanics begin to be the wall: a locked door with no key in 16, a door shut until the room is cleared in 11, a block to push in 11. It also dies 3 times per dungeon and spends 29% of its time in the first room, walking back. The same run continues for 45 minutes, with a twin that may split itself", lesson: "Two small things together (what it sees, what it is paid for) moved a number that 20 million steps had not."}
    - {name: "Stuck at 3 rooms: it does not walk through open doors", status: testing, result: "two more 40-minute runs, tested on 64 dungeons never seen: 3.0 and 3.2 rooms (2.5 at the start), none finished, and both runs stopped themselves when the reward stopped rising. With a stricter split test (39 shuffles instead of 19) the network did not split once in 21 tests, so last night's 8 splits were weak ones. Then I counted where it stops, from the simulator's own state (the network never sees this): it reaches 2.6 rooms of 11, and in 30 of 32 dungeons there was an open door in a room it had reached that it never took. Locked doors, blocks and bombs are not the wall yet. My suspicion is its eyes: every tile is only a number whose meaning changes each dungeon, so a door looks like any other number. I added two things a player also knows from playing: 'I have stood on this kind of tile' and 'how much of the room this kind covers' (a door is rare). Two runs are going: one with the new eyes, one with the new eyes and a bigger reward for a new room", lesson: "Count where it stops before guessing what is hard. I expected keys and locks; it is open doors."}
    - {name: "The network split itself for the first time: 1 expert became 8. It did not play better", status: testing, result: "whole dungeons, starting from the fighter, 35 minutes, two runs side by side. With the new test the network split 8 times out of 31 tests (chance alone would give 1 or 2), and all 8 experts are in use, each taking between 4% and 22% of the moments. But on dungeons never seen it does no better than the single network: 2.3 rooms against 2.5, none of 32 finished, and its training reward is lower (8.9 against 10.5). So the splitting works as a mechanism and has not earned anything yet. Two things I can see: every split passed the test at the lowest score 19 shuffles can give, so the test cannot tell a strong reason to split from a weak one; and the game may not yet ask for different skills. Next: 39 shuffles and a stricter bar, and more of Zelda's mechanics in the simulator", lesson: "A mechanism that fires is not a mechanism that helps. Report both numbers."}
    - {name: "From fighting to whole dungeons: slow, and it farms", status: testing, result: "the fighter put into whole dungeons, one network, 35 minutes, 7.3 million steps. Rooms visited on unseen dungeons went from 1.7 to between 2.5 and 3.5 (the test of 32 dungeons is noisy), none finished. It takes five times more enemy health than at the start and loses five times more hearts. The reason is in my reward: enemies come back when Link returns to a room, and I paid for every hit, so it learned to fight the first rooms again and again. Now a room's enemies pay once. The test is 64 dungeons from here on", lesson: "A learner finds the hole in the reward before it finds the goal."}
    - {name: "My split test was blind, and I can prove it", status: testing, result: "the network never split, so I looked at the test instead of the network. The test compared, moment by moment, how the expert is being pulled with what it sees. But that quantity is exactly what training pushes to zero: it is the expert's own gradient. The better the expert has learned, the less the test sees. It could only ever read noise, and it did: 0.8 to 2.3 times the shuffled level in every run. What a second expert really adds is a different answer on each side of a boundary. So the new test looks for a boundary: a plane in what the network sees such that the pull on one side is the opposite of the pull on the other. I proved that the gain of splitting there equals the size of that one-sided pull. The plane is found on half the dungeons and measured on the other half, and compared with 19 shuffles where each dungeon's pulls are handed to another dungeon. Small check with three made-up tasks: the old test reads 0.00 on all three; the new one reads 1.0 on the task one expert can do (no split), and 5.5 and 7.7 on the two that need two experts; predicted gain -0.00432, measured -0.00428. A run with the new test is going now on whole dungeons. Its first three tests say no split, which may be right: nothing shows yet that this game needs two experts", lesson: "When a detector never fires, test the detector on a case where it must."}
    - {name: "No room to learn by heart", status: kept, result: "asked for by the owner. The simulator had 6 fixed arrangements of blocks for its rooms. Now every room's blocks are drawn new: 606 different arrangements in the first 150 dungeons, each checked so that no corner is walled off. Training never plays the same dungeon twice, and the test dungeons are never trained on"}
    - {name: "The network learns to fight", status: kept, result: "the smallest task I could give it: one room with enemies, 400 steps, and the only reward is hits given and hits taken. Tested on 32 rooms it never trained on. Untrained: 3 rooms cleared, 2.2 enemy health taken, 2.3 hearts lost. After 10 minutes of its own play: 20 rooms cleared, 7.4 enemy health taken, 1.3 hearts lost. At the end (3.6 million steps, the run stopped itself when the reward stopped rising): 21 rooms cleared, 7.4 enemy health taken, 1.0 heart lost. Every training room is new, and so is every test room. This is in my simulator, not yet in a real Zelda. It is the first thing in this project that a network learned from play and that holds on rooms it has never seen", lesson: "When nothing learns, shrink the task until something does, then grow it back."}
    - {name: "Why the first runs learned nothing: I audited the learner", status: kept, result: "three faults, all mine. The network could not see which way Link faces, and the sword strikes that way, so it could not aim. The learner spent 83% of its time on weight updates and 17% playing (984 steps a second); on the Mac's graphics chip and with the memory pass done in stretches it does about 3,300. And it had updated only 230 times in 1.9 million steps. Training now prints an audit line every 10 updates (is the reward rising, is it still trying different buttons, does it predict what happens) and stops itself after 8 minutes without progress", lesson: "Audit the learner before blaming the task. And a run that cannot stop itself wastes the night."}
    - {name: "Two 30-minute runs on whole dungeons: nothing learned", status: rejected, result: "one network, and one allowed to split itself into experts. On 32 dungeons never seen: 2.0 and 2.1 rooms, 0 of 32 finished. Random button presses: 1.8 rooms. All they learned was to stop standing still. The splitting never fired: its signal stayed between 0.8 and 2.3 times the shuffled level, and it needs 3", lesson: "A whole dungeon was too big a first step for a learner I had not checked."}
    - {name: "A network that splits itself into experts: the maths first", status: testing, result: "the owner's idea: start with one network, and let it split in two when one part is being pulled two ways. I wrote the proof before the code. A split can be made so that the network behaves exactly the same just after it (the loss does not move). The gain of splitting along a direction is, to first order, read from one matrix: how each moment pulls on the expert, against what the network sees at that moment. Split along its strongest direction, and only if it stands well above what shuffled moments give. A small numeric check: predicted gain -0.000417, measured -0.000415; after training the split network's loss went from 0.0833 to 0.0016 on a task one expert cannot solve. Limits: it is local, first order, and noisy when the data comes from play. Not shown to help the agent yet: in the two runs above there was nothing to split, because nothing was learned", lesson: "Prove the small thing, check it with numbers, then spend the compute."}
    - {name: "A simulator that follows the first Zelda's mechanics", status: kept, result: "asked for by the owner. Dungeons of 7 to 15 rooms drawn new each time: doors open, locked, shut until the room is cleared, opened by pushing a block, or bombable; keys, map, compass, boomerang, bow, bombs, heart container, the triforce behind a boss; 15 kinds of enemies. 300 dungeons checked finishable. About 46,000 steps a second. Written from memory, not measured against the real game, and without dark rooms, old men, rupees, the item menu or the overworld. The network sees it through the same eyes and presses the same buttons as in the real Zelda 1"}
- phase: "Judged on dungeons never seen (from Nov 13)"
  items:
    - {name: "A generated game with the same eyes and hands as Zelda 1", status: testing, result: "asked for by the owner, and overdue: my practice dungeons gave the agent 9 big moves on a tidy grid, nothing like what it meets in a real game. The new one is a small game of its own behind the very same adapter as Zelda 1: the agent reads tile numbers and object slots from memory and presses pad buttons frame by frame. Every start is a new dungeon: rooms, doors (open, locked, shut until the room is cleared), keys, enemies. What each tile number and enemy number means is drawn again per dungeon, and so is what each enemy does. My first generator left 55 of 400 dungeons impossible to finish (keys behind their own locks); fixed, all 400 checked. The unchanged agent, 16 dungeons of 20,000 steps: 5.0 rooms, 3 finish a dungeon, 6 never leave the first room (not understood yet); a random player: 2.6 rooms, none finished. No network is trained on it yet. The rules of this game are written by me; the agent is not told them", lesson: "Same eyes and hands first, then learn. I trained in a world the real games do not look like, and was surprised when nothing carried over."}
    - {name: "Where do lives end? I had never counted", status: kept, result: "the bench now logs every game over: where, among how many enemies, how long the life was. Zelda 1, 32 games on fresh seeds: 1,323 game overs, 41 per game. 1,186 of them are outside, on the overworld; 137 are inside the dungeon. For two days I wrote that the wall was dying in dungeon rooms. Most lives are lost wandering outside, before and between dungeon visits", lesson: "Count before naming the blocker. The sentence I repeated was true of the deepest games and false of the average one."}
    - {name: "A report on why it stalls, and one on the maths", status: kept, result: "two research passes, each with an audit of this project's own record. First: every real-game gain came from me tracing one room and writing a repair; nothing learned from play is on in a real game; 16 games cannot tell most ideas apart and I adopted several on a difference of one to three games; no published agent does what this one is asked to do. Second: the maths of the network can be improved cheaply (a value loss that does not depend on reward sizes, credit that reaches further and stops at a game over, reward for progress with survival as a limit, reading the list of objects directly, memory across lives), but no experiment here ever changed only the maths, and data and the simulator weigh more. What changes: benches of 32 games or more, the generated game above, then a network trained on it", lesson: "The builder learned; the agent did not. That was the answer to 'why is it not progressing'."}
    - {name: "An untried exit in the room I am in comes first", switch: FARNEW, status: testing, result: "after the king the agent circled three castle rooms for 9,000 steps. Its own map showed the way out at the bottom of a tall hall and it never took it. First guess from the trace (a far exit is scored as 'nothing new here'): changed it, no effect, removed. Then I printed the choice itself: when a room looks spent the agent travels to another room that has an exit never taken, and never asks whether the room it stands in has one. With that asked first, it walks out of the castle. Whole Minish Cap games from the start, 80,000 steps: 8 of 8 reach the castle, the king and the new sword (3 of 8 without). But the usual tasks: 13 of 24 against 16 - the lever puzzle 1 of 4 against 4 of 4, because it now walks off to an untried exit instead of finishing the lever. Zelda 1: same places, the dungeon entered much later (median 54,600 steps against 30,900). A second version (only when a trip elsewhere was about to start) still loses the lever, and more budget does not help: 0 of 8 in 9,000 steps against 8 of 8. What pulls it away: the task starts inside the dungeon with an empty map, so the door Link came in by counts as 'an exit never taken', and he walks out of the dungeon and stays outside. In a whole game that door would be known. So part of this loss comes from how the task starts, but I have not shown that, and the later dungeon entry in Zelda 1 is real. Off by default", lesson: "My first guess from the trace was wrong; printing the decision found the cause in one run. And a gain of 5 games in one place does not excuse losing a puzzle in another."}
    - {name: "When the game holds Link: find which input gives control back", switch: TRYOUT, status: kept, result: "the wall after the scrub was not a puzzle. Link lies asleep in a castle bed, the game gives no control, and my code only tapped one button there: 11,500 steps on one tile. Only mashing the directions wakes him (measured on the emulator: a new direction every frame wakes him in 350 frames, a direction held for a whole step never does). Now the agent tries one input per burst (each button, directions mashed, nothing) and puts first the one after which control came back most often. From the saved bedroom: awake in 300 steps, story score 92 to 146, three more castle rooms; its own count says the action button gave control back 41 times of 54 (talk) and mashing 2 of 14 (the bed). Whole games from the start, 80,000 steps: 3 of 8 reach story score 146 with 7 items and 11 to 12 places, a fourth reaches the bed (none left the field before); places 8.4 against 5.4. The usual tasks: 16 of 24 (15). Zelda 1: level", lesson: "I took 'no control' for a puzzle the agent could not solve. It was my own fixed habit of tapping one button. A habit written for one game is a mechanic written in."}
    - {name: "Experiments: find what a button does, in play", switch: TRYOUT, status: kept, result: "nothing about any enemy is written in. On a thing that moves, the agent tries each of its three buttons, from next to it or from a few tiles away, tapped or held; each way once per kind of thing in a room, cheapest first, after the room's other options. A way that made its target go away is used first from then on in that game; a way that never worked in three tries is dropped. From a saved arrival at the field north of the town: 7 of 8 find the way past the scrub by themselves in 6,000 steps (it is the last of the eleven ways). Whole Minish Cap games from the start, 60,000 steps: 3 of 8 pass (0 without, 5 with the move written in). The usual tasks: 15 of 24, the same. Zelda 1, 16 games: level (dungeon 12 against 14, 10 rooms in 5 games against 3). Practice dungeons: 306 of 400 against 322, deaths 48 against 29: nothing there yields to an experiment, so it only costs. Then I checked what it had recorded: it passed, and every experiment was marked 'did nothing', because I judged each one the moment it ended and the enemy leaves a little later. It passed without learning the move. Fixed: an experiment is credited if its target is gone within the next few goals. Now 8 of 8 from the saved arrival; whole games still 3 of 8; Zelda 1 a little lower on the same seeds twice (dungeon 11 of 16 against 14, nothing outside chance), being run on fresh seeds. The credit is still loose: one run credits two ways at once. Zelda 1 on fresh seeds: level (over 32 games, dungeon entered 24 against 26). A Link to the Past: the same, 8.9 places. Default since Nov 13, with the practice loss stated: 306 of 400 against 322", lesson: "If I had to read the game to find it, the agent did not learn it. What I may write is how to experiment, not the answer. Still mine: 'a few tiles' is 3 and 'held' is 240 steps. And passing is not learning: look at what it recorded, not only at whether it got through."}
    - {name: "The field north of the town, looked at properly", switch: RANGED, status: rejected, result: "what stops Link there is one enemy: a Business Scrub sitting in the only gap of a hedge. Link stood 12 pixels below it for thousands of steps. I could not pass it by hand either, so I read how the enemy works: it comes up and shoots only when Link is 32 to 80 pixels away, hides when he is closer, and leaves when its shot is bounced back with the shield. The agent only ever used what it holds by one tap from the next tile. New option, naming no enemy: use the held thing from 3 to 4 tiles away, in line, facing a thing that moves, button held; at most twice per kind of enemy per room, and it stops for good after 6 tries that change nothing. From a saved arrival at the field: 8 of 8 pass, 0 of 8 without. Practice dungeons with it on: 302 of 400 against 322, so it costs something there. Whole Minish Cap games from the start, 60,000 steps: 4 of 8 pass the scrub, 2 reach 9 places and a first dungeon room (nobody passed before). The usual tasks: 11 of 24 against 15. Zelda 1: wrecked, no game enters the dungeon (14 of 16 without), game overs 13.9 per 10k steps against 5.3: my limit of six useless tries was lifted for good by the first try after which anything at all changed, and Link stood still for 240 steps among enemies, room after room. Tightened, it passed every check but the practice dungeons. Then removed anyway: I was told the agent must guess mechanics while playing, not be handed them", lesson: "The 'bring' goals were only where the time went, not the cause. And I am the one who learned the mechanic here, by reading; the agent got an option, not an understanding. Said plainly because that is the thing I was told to stop doing. And a limit that a noisy 'something changed' can lift is no limit."}
    - {name: "Minish Cap's first story wall: stay with the companion, and try ground that is only partly solid", switch: "ESCORT, PARTIALOPEN", status: kept, result: "from the game's start every game stopped in the town. The trace: Link walks off, the game stops him with Zelda's line 'LINK! Where...', and half the game goes by. Two general pieces, both written earlier and left off: stay with whoever the game says Link is walking with; ground that is only partly solid is unknown, not wall (the town's way north is made of it). Together: all 8 games reach the next story point (4 of 8 before) and 3 games see a place never seen before. The usual tasks: 15 of 24, the same. Nobody gets further yet", lesson: "I had deleted the second piece in a cleanup because it gained nothing alone. Two things that each do nothing can do something together."}
    - {name: "The field north of the town: two guesses", status: rejected, result: "there the agent spends 7,700 of 9,300 steps trying to bring one object onto one spot after another, 600 steps a try. Guess 1, 'what moves by itself cannot be placed': the games did not change at all. Guess 2, 'stop after two failed tries on one thing': no better. Both removed", lesson: "Two guesses from one trace is where I stop and look again."}
    - {name: "Minish Cap: learn from many more start places", status: dropped, result: "the one thing that came back twice in the fair tests: the learner was better where it had trained from four places (outdoors) and worse where it had trained from two (the dungeon). The answer would be many more places to learn from. I tried to make them: from the five saved starts the agent reaches about a dozen rooms of the game in all, ten of them are the test places, and only two new rooms came out", lesson: "A learner needs places to learn from, and the agent does not get far enough into the game to give it any. Learning in a real game waits for the agent to get further by other means."}
    - {name: "Minish Cap with late credit", status: rejected, result: "the first Minish learner was paid for each new room and learned to leave. This one is paid for story progress, items and keys, and credit reaches much further back. Usual six tasks: 15 of 24, the same as without, lever puzzle kept. Fair test on ten new start places: first run, story score +0.78 and ground +9 places, both just above chance; second run on fresh seeds, +0.34 and +4, both inside chance. Only 'reaches more rooms' holds twice. And the same split both times: clearly better in four outdoor places, clearly worse in four dungeon rooms (in one, 26 places covered against 94)", lesson: "A borderline result gets run again before it is believed: this one did not come back. The split says where it learned: it trained from four outdoor places and two in the dungeon."}
    - {name: "A mechanic it never met in training", status: kept, result: "the critic's hardest question for the practice set: does the agent work out, inside a dungeon, something it never trained on? I trained the ranking on dungeons with no lever at all, then on dungeons with no web, and tested on usual dungeons that have one. With a lever (113 dungeons): my ranking 52, trained with levers 80, never saw a lever 73. With a web (228): my ranking 109, trained with webs 167, never saw a web 141, and the web stays shut in 46 of them (20 when trained with). So most of the gain carries to a lever (it pulls things it has not tried), about half to a web (using a carried item on a shut way is mostly learned in training, not found out on the spot)", lesson: "It learned some general habits (try what is untried, go back to what was shut) and some facts of that world. A new game would get the habits, not the facts."}
    - {name: "Train the practice ranking only on what a player can see", status: kept, result: "the critic was right that the training score read the simulator's own record of progress, and that the agent could even see its count. Both removed: the score is now a room never seen, a key more, something new in the bag, a shut passage open, the dungeon solved, death. Set I may look at: 322 of 400 (319 with the record). Never-opened set: 77% (78% with it)", lesson: "The record was not doing the work. Good to know before trying the same in a real game, which has no such record."}
    - {name: "A critic attacks the new method", status: kept, result: "I asked a second agent, read-only, to find what was wrong or oversold. It was right on most points. (1) The 'looks' were the simulator's own kinds renamed, the same in every dungeon: the agent memorised them. Test: draw new looks in every dungeon. 80% fell to 71%; retrained so that it finds out inside each dungeon what a look answers to, 78% (my ranking 57%, a random option 40%). (2) The Minish Cap win is not shown: same six start places in training and test, runs nearly identical from seed to seed, the training told when a task was done, 24 against 19 of 36 is chance one time in three. (3) 'The learner beat my rules' was too strong: it orders options that I wrote. (4) Nobody checked that every generated dungeon can be solved. (5) The training score comes from the simulator's own ledger. The home page is rewritten around this", lesson: "Ask for the attack before believing the number. The strongest claim was the weakest."}
    - {name: "The same learner on Minish Cap's own play", switch: "GV (per game)", status: rejected, result: "first reported as a win: 24 of 36 tasks against 19. The critic doubted it, and a fair test settled it. Retrained without being told when a task is done and with runs that really differ from seed to seed: on the usual six tasks 13 of 24 against 15 (it walks two to three times faster, and loses the lever puzzle: 1 of 4 against 3). On ten start places it never trained from, 120 paired runs: rooms reached 4.7 against 3.9 (clearly more: better in 53 runs, worse in 18), ground covered 100.4 against 100.6, story score gained +0.13 (between -0.5 and +0.8). It leaves rooms sooner and solves less. Turned off until that is understood", lesson: "The win was the training being told when the task ended, on the very places it was tested from. And my first fair test was itself broken (one side scored 0 everywhere): a result that looks too clean is a bug."}
    - {name: "Does what it learned in generated dungeons work in Zelda 1 as it is?", status: rejected, result: "no. With the ranking learned only on generated dungeons, 0 of 16 games even pick up the sword, places 29 instead of 55, game overs three times as many", lesson: "It learned that world, not Zelda in general. Each game has to learn from its own play; what carries over is the way of learning."}
    - {name: "The same learner on Zelda 1's own play", status: rejected, result: "the real game marks gains too: a place never seen, a key, the game's own score going up. Trained on 81 full games on other seeds (87,850 scored choices), checked on the usual 16: places 49 (55), dungeon 11 of 16 (14), key used 6 (9), dungeon rooms 4.1 (6.6); only the second item is better, 7 (3). Why: 90% of the agent's choices in Zelda 1 are 'which exit of this room', and it almost never sees a thing to act on (21 times in 59,000 choices). There is nothing for a learner to rank", lesson: "Learning won where the agent sees many options. In Zelda 1 the limit is what it sees, and the travel between rooms, which my rules still decide."}
    - {name: "Learned: which option to take, from what followed its own choices", switch: GV, status: kept, result: "after three of my rules failed in a row I stopped writing rules for 'what next'. The agent's options stay the same; what ranks them is learned. It plays 3,000 training dungeons per round, takes a random option a quarter of the time, and each choice is scored by what followed: first-time gains (a room, a key, a way opened), the dungeon solved, death. A small network learns that score from 33 numbers that name no game. Six rounds, five minutes, the set I may look at checked after every round: 256 -> 319 of 400. Never-opened set, run once: 64% -> 80% (322 of 400), median steps 949 -> 439, deaths 52 -> 32, hardest levels 27 -> 49 of 80", lesson: "The learner beat two days of my rules in five minutes. Give it the options and the outcomes; do not write the ranking."}
    - {name: "Carrying: lift a thing and throw it onto marked floor", switch: CARRY, status: off, result: "the agent learned by itself which look ends up in its hands (93% of 1,462 tries). With that, 'bring it to the marked floor' became lift, stand in line, throw: it works 242 times of 711 (pushing: 54 of 505) and every throw lands. Floor-switch puzzles left unsolved: 58 -> 50. But dungeons solved, on the set I may look at: 245 vs 256. 7 gained, 18 lost: the pots that hide keys get parked on switches instead of being broken", lesson: "A skill that works is not yet a gain. It also has to know when not to be used."}
    - {name: "Learned danger: do not fight what the sword never hurts", status: rejected, result: "the agent learned it exactly from its own strikes: one enemy look hurt 0 times in 8,172, the other every time. Using it (no swing, two tiles of room): 246 vs 256 solved and deaths 72 vs 50; each half alone: no gain. I do not understand why not swinging costs lives"}
    - {name: "The same learning in a real game: Minish Cap learns its own table", status: rejected, result: "the agent now counts every try on a thing in any game. Minish Cap learned from 72 runs on other seeds: hitting a Forest Minish did nothing 102 times of 102, an archway answered the action button 114 of 114. Using that table on the usual check: 13 of 24 instead of 16, and slower everywhere. A careful version that only skips actions that never did anything: 12 of 24", lesson: "In the generated dungeons a try that leads to a key is marked; in the real game almost nothing is, and 'something changed' is noise (things bob and blink). The table needs a real signal of progress before it can rank anything there."}
    - {name: "A locked door left with the key in hand: a look at one case", status: off, result: "in the case I opened, the agent stood on a switch and a chest appeared in the only passage to the door: a dead end the generator allows. Some failures on this bench are not the agent's, and its ceiling is below 100%"}
    - {name: "Learned: what each kind of thing answers to", switch: LOOKS, status: kept, result: "the first deciding piece the agent learns by itself. In the generated dungeons it could not tell one thing from another, so it tried all five actions on everything: 14,000 tries on 400 dungeons, most useless. Now it sees each thing's look as a number with no meaning, and every try is counted: look, action, did something happen, did it lead to a key or an opened way. Learned on 2,000 training dungeons in 43 seconds. Never-opened dungeons: 57% -> 63% (253 of 400), 71% with three times the steps; chests left shut 43 -> 13 on the set I may look at", lesson: "Not wired to the real games yet. There each game needs its own table, learned from its own play."}
    - {name: "Learned seeing: a kind of wall seen opening is a kind that can open", switch: OPENS, status: kept, result: "the real games showed the agent no shut doors, only walls. Now when ground it could not walk on turns into ground it can, at the same spot, it remembers that kind and sees every tile of it as a shut passage, in every room. No label from me. First version learned every rock and tree (walking into a cave swaps the whole screen): dungeon reached in 2 of 16 games. Fixed to small changes inside one room. Zelda 1, 16 games: 10 dungeon rooms 3 vs 2, dungeon rooms 6.6 vs 6.2, game overs 5.3 vs 5.0", lesson: "A learned rule needs the same 16 games as a written one: the first version was a disaster."}
    - {name: "Push plans: push from the side the plan walked to", status: kept, result: "the bench counts goals by kind: 'bring a block to a switch' worked in 5 of 497 plans. The hands walked round the block to a side picked by a counter meant for experiments. Fixed: 54 of 505. Dungeons I may look at 59% -> 60%, never-opened 56% -> 57% (228 of 400, inside the noise). Minish Cap check the same; Zelda 1: 16 games identical (it never pushes a block there)"}
    - {name: "Come back to what stayed shut when I hold something new", switch: HELD, status: kept, result: "the bench counts by itself what was left shut in failed dungeons: 49 of 184 had a locked door with a key in hand, 27 a web with the item for it, 14 the boss door with its key. Now a failed try on a shut passage is remembered with what Link held; holding something else makes it new again. Dungeons I may look at: 54% -> 59%. Dungeons nobody opens: 54% -> 56% (225 of 400). Zelda 1: 16 games identical to the last number. Minish Cap check the same", lesson: "The rule never fires in Zelda 1: its adapter shows no shut passages, only walls. The generated dungeons hand the agent things the real games do not show it. A gain here is a gain in deciding, not yet in seeing."}
    - {name: "Bench of generated dungeons nobody looks at", status: kept, result: "400 test dungeons in 8 seconds, same brain, same planner as the real games. Start: 54% solved (levels 1-2: 79%, levels 9-10: 30%); a separate set of 400 I may look at gives the same 54%", lesson: "The yardstick was one dungeon of one game. The layouts of this one cannot be memorised; its rules can, and were (see the critic's entry)."}
    - {name: "Two-way crossing memory (arriving through a door teaches how to leave by it)", switch: CROSS2, status: off, result: "16 Zelda 1 games: dungeon 13 vs 14 and 10,000 steps later, map or compass 2 vs 4. No gain"}
- phase: "After the review: skills judged on saved scenarios (Nov 12)"
  items:
    - {name: "Crossing memory: remember the pixel and direction of every room crossing that worked", switch: CROSS, status: kept, result: "the dungeon wall. Doors sit between two tiles (at pixel 128; tile centres are 120 and 136). An exit was remembered as a tile, and getting back on its line took luck: thousands of steps in one room, key in hand, both doors failing. Now a walk toward a remembered crossing first gets on its exact line, and a planner with no route to a known exit goes and stands in front of it. 16 games: 10 dungeon rooms 2 vs 0, map or compass 4 vs 1, dungeon rooms 6.2 vs 5.2. 16 held-out games: 10 rooms 6 vs 1, map or compass 7 vs 2, game overs 4.6 vs 5.7, hits 25.3 vs 30.9. A Link to the Past: 8.9 places vs 7.6, first games with 2 and 3 items. Minish Cap check 16/24, same", lesson: "The fix came from one room traced to the pixel, not from a new idea about fighting or exploring."}
    - {name: "A doorway is not water: carried forward is not a fall", status: kept, result: "I read the game's own door table (to diagnose, the agent never sees it): after 7 rooms the only way on is one locked door, and Link sat thousands of steps in the room above the entrance. Its doorway tile was marked water: the game walks Link through a doorway by itself, 40+ px in one action, which my 'fall' rule took for falling in. 16 games: dungeon 14 vs 12, key picked 13 vs 10, 5 rooms 12 vs 9 and 17,000 steps sooner, key used 11 vs 9. Minish Cap check 16/24, A Link to the Past unchanged", lesson: "Trace the one room where the time goes. Three bugs were in it."}
    - {name: "Successful door sidesteps not counted + hunt enemies in dungeons", switch: "GAPOK, HUNT", status: off, result: "dungeon scenarios better (key 52% vs 46%, 3 rooms deeper 80% vs 72%, past 5 rooms 70% vs 63%, past 7 rooms still 0/12). 16 full games: dungeon 9 vs 14, and at 75,000 steps", lesson: "Dungeon scenarios do not see what a change does outside. Second time the sidestep change loses in full games."}
    - {name: "The exit is remembered on the tile beside the doorway", status: kept, result: "in the doorway Link reads as the next tile, so 'reach the exit tile' never ended: about 850 steps per try. Solved by crossing memory (above)"}
    - {name: "Leave an enemy alone after 3 strikes that did nothing", switch: NOEFFECT, status: off, result: "trace of every hit in one game: 41% of the steps outside are sword strikes, 1,235 of them at one kind of enemy with 19 effects. With the rule useless strikes fall to 252. 16 games: places 56.4 vs 51.2, second item 9 vs 7, but hits 37.2 vs 27.8 per 10k, game overs 6.7 vs 5.1, key used 7 vs 9", lesson: "Time freed outside is spent walking into more enemies. Four outdoor ideas in one evening, none moved the boss: the wall is in the dungeon."}
    - {name: "See movement: object position now minus 8 frames ago, step out of the line of a fast straight mover", switch: DODGE, status: off, result: "user's idea. 16 games: game overs 5.3 vs 5.1 per 10k, hits 28.7 vs 27.8, places 54.4 vs 51.2, dungeon 13 vs 12 but at 47.5k steps vs 25.6k, key used 8 vs 9. No gain"}
    - {name: "Faster fighting: one-press strikes, a walk is interrupted to strike", switch: FINEFIGHT, status: off, result: "the fight test said deciding every 8 frames instead of 16-32 halves the deaths (22 vs 49 vs 62 of 240). 16 games: game overs 5.3 vs 5.1, places 57.1 vs 51.2, key used 7 vs 9, 5 rooms 7 vs 9. No gain", lesson: "The fight test repeats one action between decisions; the real agent does other things. A test that is not the real loop can point the wrong way."}
    - {name: "Dodge shots: step out of the line of anything fast heading at Link", status: rejected, result: "outdoors at least 24 of 85 hits come from a shot, not a touch (measured standing still). The agent sees a shot as a dot, with no speed. Dodge alone: 53 -> 39 game overs on 240 danger moments. On top of the strike rule: 37 -> 37. Dungeon: no shots, no change", lesson: "A shot lives 3 to 12 decisions and crosses more than a tile per decision: seeing it is not enough at this decision speed."}
    - {name: "A Link to the Past: the unknown inside before the edge", status: rejected, result: "capture: 80 goals in 25,000 steps, all to the edge of a map square, never to the inside where doors are. With inside-first: 18,000 steps in one square, 112 failed walks", lesson: "Learning a map by bumping, one 16 px cell at a time, is too slow to explore with."}
    - {name: "A Link to the Past: find the game's tile table in memory from where Link walked and was refused", status: off, result: "two ways of scoring 256 KB of memory, no table found yet"}
    - {name: "Gap sidestep: do not count successes, forget failed tries", status: rejected, result: "kept for an afternoon because it was 'logically right' and equal on scenarios. 16 games: dungeon 9/16 at 66.8k steps vs 12/16 at 25.6k, dungeon rooms 2.8 vs 5.1. Reverted; the 16 games are identical to the best model again", lesson: "Equal on scenarios is not equal. Nothing becomes the default before its 16 games."}
    - {name: "End a walk that has no route after 3 idle actions, not 8", switch: FASTFAIL, status: rejected, result: "scenarios 132/192 vs 131/192, first ever pass of 'a new room after the 7th' (1/12). 16 games: dungeon 13 vs 12, key 12 vs 10, low-health time 7.4% vs 11.5%, but all of it later (dungeon at 39.3k vs 25.6k), key used 8 vs 9. No gain: deleted"}
    - {name: "Cleanup: 19 rejected rules deleted from the code", status: kept, result: "in 4 steps, each giving the same games to the last number (2 games at 20k after every step, 16 games at 80k after three)", lesson: "115 switches hid what the model really is."}
    - {name: "Scenario suite: 70 saved moments along the ladder, 3 minutes", status: kept, result: "current model: 3 rooms after entering 85% (empty memory) but 45% with what it had learned; key used 0-3%; heals at 1 heart 1-3%", lesson: "The agent did better with an empty memory than with its own: its beliefs were the trap."}
    - {name: "No try-new-ground on a known exit", status: kept, result: "entering a dungeon every ground kind is new, and the nearest 'new' tile was the doorway behind Link: his third goal walked him back out. 3 rooms after entering: 41% -> 78%", lesson: "Found by tracing one scenario, after two wrong guesses."}
    - {name: "Minish Cap from the game's start: the town stall", status: testing, result: "decision log: the festival = talk to Zelda, she walks to her next spot, follow. 'Stay with and talk to your companion' (ZL_ESCORT): story score 101 at 25k steps instead of 37k. Then a second blocker, same in both: with Zelda following, Link keeps trying the south gate, a text box stops him (one line on screen for 8,400 steps), and his map shows a solid wall across the town to the north. 70k steps: still 5 places. Earlier tries with no effect: dialogue as progress, partial-collision tiles as unknown ground, LLM story guide", lesson: "Logging every decision found in one run what four blind 30k-step tries had not."}
    - {name: "No probe within 2 tiles of a known exit", status: kept, result: "the route to a probe near the door went out through the door gap. Scenarios: enter 28% -> 48%, deeper 38% -> 62%. Minish Cap check 31/48 (best)"}
    - {name: "No list of objects: use whatever refused the step", status: kept, result: "random play's first item in A Link to the Past is the chest in Link's own house, opened with the action button; the agent only walked. Now, on a game whose adapter lists no objects, a refused step is followed by the action buttons toward what blocked it, once per spot and direction. 8 games: first item 38% (was 0%; random 50%), 7.6 places (random 6.8). Zelda 1 and Minish Cap untouched (their adapters list objects)", lesson: "I had called the first item 'the sword'; it was the lamp. Look at what a number counts."}
    - {name: "Frozen on one spot: press the action buttons, forget the bumped walls", status: kept, result: "trace of a full A Link to the Past game: the last 10,000 steps on one spot - a text box the adapter cannot report (Zelda's telepathic message), and a bump map closed around Link. Now 30 actions on the same pixel -> press the action buttons and forget that map's walls. 8 games: 7.2 places vs 4.2 (random 6.8), worst game 6; sword still 0%. On Zelda 1 the same reflex leaned the dungeon rows down (key used 38% vs 56%), so it only applies to adapters that cannot report text boxes", lesson: "A change that helps one game must be checked on the other before it becomes general."}
    - {name: "A Link to the Past: a map learned by bumping", status: kept, result: "that game's adapter gave the agent no room map, so it made no decisions. Now every spot of a room is floor until a step into it is refused; then it is wall for that room. Nothing game-specific beyond Link's position and the room size. 8 games x 40k steps: 3.9 places (was 1), sword 13%; random buttons 6.8 places, sword 50%. Trace: one wrong wall learned in the doorway sealed Link in his house for 14,800 steps; stall escape now also forgets bump-map walls: 4.2 places, worst game 2 (was 1). It plays, still worse than random: about 33,000 of 40,000 steps with nothing new"}
    - {name: "Walk up and strike inside dungeons, deciding every 8 frames", switch: HUNT, status: off, result: "240 danger moments from inside dungeons: stand still 76 game overs, keep away 51, walk up and strike 28 (345 kills, 11 hearts healed), strike in line 22. In the agent: scenarios after the 5th room 50% (was a third), after the 7th 3 of 6. 16 full games: neutral - 5+ rooms 63% vs 56%, key used 44% vs 56%, 5.1 dungeon rooms per game both, best game 12 rooms vs 11, game overs 4.5 vs 5.1 (not clearly different)", lesson: "The small deep-scenario pools overstated it again. Striking in line (already on) gives most of what fighting gives for now."}
    - {name: "Deepest rooms first when going back into a dungeon", switch: DEEPFIRST, status: rejected, result: "capture of the 11-room game: deep rooms are not closed off - Link crosses each in 2-3 decisions, sees real exits, dies in his 10th room with 3 enemies around, restarts at the entrance and does not go back down. Deepest-first: 16 full games places 40.9 vs 51.2, game overs 7.2 vs 5.1 (both clearly worse), key used 38% vs 56%", lesson: "Rushing back to where he died gets him killed there again. What limits depth now is dying in rooms with several enemies."}
    - {name: "Exits tried six times and never passed stop being targets", switch: TRIEDOUT, status: kept, result: "two fake exits by the dungeon entrance were tried 25 times each: 'try the exit on arrival' ignores past failures and stall escape resets the failure counts. Tries are never reset. Game-11 probe: entrance loop 3x shorter. 16 full games: places 51.2 vs 48.1 (clearly better), key used 56% vs 50%, 5+ dungeon rooms 56% vs 50%, nothing clearly worse. Minish Cap check 29/48. Default. (Remembering tested spots per room changed nothing on the probe.)"}
    - {name: "Stall escape without wiping learned walls", status: rejected, result: "game 11 after its 10th dungeon room: 53,000 steps between the two rooms by the entrance. Capture: the entrance room's map was fiction (openings all round the border): stall escape wipes every learned wall kind each time it fires, so every dungeon room grows fake exits again and the nearest ones are by the entrance. 16 full games without the wipe: dungeon 44% vs 75%, dungeon rooms 2.2 vs 4.6 - worse: the wipe also clears wrongly learned walls early on. Wipe restored. Also tried: go straight back to the room of the last game over - no gain, and the game-start scenario dropped to 6 of 8. Off", lesson: "The wipe is needed early and harmful late. The agent must tell 'I tested this spot in this room' from 'this kind of ground is a wall'."}
    - {name: "Why places and 2nd items dropped with striking", status: kept, result: "not a bug: Link now spends 18% of his steps inside dungeons, was 7%; the overworld gets less time"}
    - {name: "Scenario from the game's own start", status: kept, result: "8 seeds, first item within 3,000 steps: 100% at step 308. Catches what the other scenarios start after"}
    - {name: "Strike what is in the sword's line (scripted, from the fast fight practice)", switch: FIGHT, status: kept, result: "fast practice setup (5,400 steps/s; the trained reflex ran at 100), 240 danger moments: stand still 53 game overs, strike in line 37, keep away 15, strike + back off 12. In 16 full games: strike + back off v1 backed away from the sword cave's old man (sword 3 of 16); v2 (only kinds that have hurt Link) game overs 3.5 but dungeon 13% vs 69%: backing off stops progress. Strike only: game overs 4.4 vs 6.2 and hits 24 vs 34 (clearly better), first game with 10 dungeon rooms (11), map or compass 13%, dungeon rows the same; places 48 vs 56 and 2nd item 38% vs 69% (worse). Minish Cap check 30/48. Now the current model", lesson: "A few lines of script, tested fast, beat two trained reflexes. Backing off needs to know where Link is going."}
    - {name: "Deep in the dungeon (new scenarios at the 5th and 7th room)", status: rejected, result: "baseline: 2 more rooms after the 5th 35%, after the 7th 17%. Log of one run: 41 round trips between the two rooms by the entrance - each room's fake exit (unknown wall read as opening) keeps the other alive through 'fresh eyes'. No change: dropping the forget-walls-on-key rule (key use fell 45% -> 22%, kept), door spots, revisiting far rooms. Frontier failure memory (an exit whose trips failed twice stops being a target for good): after the 5th room 55%, after the 7th 33% - but 16 full games: places 63.4 vs 55.8 (better), 5+ dungeon rooms 44% vs 56%, game overs 8.1 vs 6.2 (worse). Off: it helps the overworld, not the dungeon", lesson: "A 20-point gain on 20 scenario runs did not hold in full games: the deep-dungeon pool is too small (20 and 6 runs) to trust."}
    - {name: "Pixel-exact line-up at doors", status: kept, result: "capture: a dungeon's side door is exactly one tile tall; Link settled 2-3 pixels off, the step was refused and the open door learned as wall; he gave it up and left. Now: refused once but open per the game's fine tiles -> line up to the pixel, retry. Scenarios: deeper 44% -> 81%, enter 93%. 16 full games: key used 50% vs 25%, 5+ dungeon rooms 56% vs 38%, 2nd item 69% vs 50%; game overs 6.2 vs 5.5. Minish Cap check 30/48. Now the current model", lesson: "A rule on top (set failed walks aside) changed nothing; the cause was 3 pixels at the lowest layer."}
    - {name: "Stay with the dungeon: no probes on a wall side that has a door + the area found last comes first", status: kept, result: "log of deaths and area changes: Link walked out of the dungeon, died on the overworld again and again, and never went back (the overworld's many untried exits were nearer). Scenarios: 3 rooms after entering 57% -> 85%, key used 50% -> 75%. 16 full games: key used 25% vs 13%, 5+ dungeon rooms 38% vs 19%, key picked up 50% vs 31%, nothing worse. Now the current model", lesson: "Three guesses failed (second look, go straight back, closing doorways to routes); the log of deaths and area changes showed the cause in one run."}
    - {name: "Survival at one heart (216 saved moments)", switch: "EVADE / RETREAT", status: rejected, result: "step-by-step log of 22 deaths: Link walks on toward enemies and dies mid 'turn, then swing'. Dead within 100 steps: current 118, retreat 71, keep-distance 89, both 66. Dead within 500 steps: 170-181 whatever I do. Both rules delay death about 3x, neither prevents it; heals drop (12 vs 23). 16 full games: game overs 6.0 vs 5.5 (no better), heals 1.4 vs 1.8 (worse), keys picked up 1 vs 5 games, none used", lesson: "My first survival numbers were inflated: scenarios began with up to 30 idle steps and Link died before his first action."}
    - {name: "Gap-aware stepping (doors between two tiles)", status: kept, result: "read from the game's finer tiles: way shut at the tile centre, open half a tile aside. Larger scenario pool: key used 35% vs 5%. 16 full games (with the exit-probe fix): places 57.9 vs 51.2, 2nd item 63% vs 19%, dungeon 81% vs 63%, first keys used (13%); game overs 6.2 vs 4.3. First version fired before every shut-looking step: no sword in 4/16 games - caught by the full-game check. Open: it lowers '3 rooms after entering' (28% vs 54%)", lesson: "Scenarios find the fix, full games catch what it breaks: both are needed."}
    - {name: "Learned ground kinds scoped per tileset", status: kept, result: "correct, but NOT the cause I first claimed: that 85% vs 45% came from a flaw in the test (scenarios started without the agent's memory of where it came from)", lesson: "Trace one scenario before believing a number."}
    - {name: "Half-step at every refused move", switch: HALFSTEP, status: rejected, result: "helps deeper rooms but costs time at every wall; replaced by gap-aware stepping"}
- phase: "Zelda 1, one continuous game (Nov 11)"
  items:
    - {name: "Learned KPIs for every idea", status: kept, result: "18 KPIs from fields every Zelda shares; showed the agent is stuck 56k of 80k steps", lesson: "Places alone hid the stalls."}
    - {name: "Half-step at refused moves", switch: HALFSTEP, status: rejected, result: "+7 places on tuning games, -1.2 held-out, more game overs", lesson: "Always run the held-out games."}
    - {name: "Entrance-aware routes", switch: SPLIT, status: off, result: "Two versions, 38 vs 49 places on the game it was built for. The loop moved into the dungeon instead", lesson: "Don't judge reachability at the screen edge. Two tries without a gain: capture again."}
    - {name: "Stall escape: random burst, then forget beliefs", switch: UNSTUCK, status: kept, result: "16 games: places 51.2 vs 46.2, worst game 34 vs 13, dungeon 63% vs 38%, keys 56% vs 25%. HELD-OUT: dungeon 81% vs 50%, keys 50% vs 25%, worst game 37 vs 25 - holds. Minish Cap check 27/48 (normal band). Now the default"}
    - {name: "Combat reflex from Minish Cap, used in Zelda 1", switch: REFLEX, status: rejected, result: "one game, 20k steps: 22 vs 49 places, game overs 30 vs 16, hits x1.7. Found: the reflex had never been on in Zelda 1 benches", lesson: "Check what is really switched on per game before describing the model."}
    - {name: "Learned goal values (first-time events only, hand scores as prior)", switch: GOALVALUE, status: testing, result: "16 games vs previous model: dungeon 63% vs 38%, worst game 33 vs 13, time at low health 3.7% vs 8.8%, first key used. Next: on top of stall escape, then held-out"}
    - {name: "Reflex reward for damage dealt", status: rejected, result: "fought far more (damage 2,861) and died more: 16 vs 12 game overs per 60 danger moments; never healed", lesson: "Reward outcomes, never the means: hits were farmed."}
    - {name: "Reflex reward for confirmed kills (hit, then gone, once per enemy)", switch: SURV_KILL, status: rejected, result: "ahead of standing still in danger moments (8 vs 12 game overs / 60), but in 16 real games: 19 places vs 51, dungeon 0% vs 63%. The reflex holds the controls near every enemy and Link goes nowhere", lesson: "A skill that wins its own test can still break the whole: test it inside the real game early."}
    - {name: "Combat reflex trained in Zelda 1 from the agent's own danger moments", switch: REFLEX, status: testing, result: "4,294 danger moments from seeds 200-215. Barely better than standing still in danger episodes (0.69 vs 0.87 penalty); one game 16 vs 49 places. It learned to avoid, not to fight. Retraining with a damage-dealt reward", lesson: "Compare a learned skill against 'do nothing' before plugging it in."}
    - {name: "Likely door spots", switch: DOORSPOTS, status: off, result: "two games: 43 vs 49 and 42 vs 49 places; third fix in a row without a gain, so I changed method", lesson: "Each capture found a different trap: per-trap fixes don't converge."}
    - {name: "Needs: survive > heal > fight > explore", switch: NEEDS, status: rejected, result: "places 39.4 vs 46.2, 2nd item 6% vs 44%, time at low health 23% vs 9%, heals halved (0.6 vs 1.2 per 10k)", lesson: "In Zelda 1 hearts drop from killed enemies: 'no fights when low' also meant 'no healing'. What heals must be learned, not ordered by hand."}
    - {name: "Learned pickups", switch: PICKUPS, status: off, result: "nothing better; 2nd item 6% vs 44%. Found on the way: touch learning had been dead code under learned doors"}
    - {name: "Retreat at low health", switch: RETREAT, status: off, result: "dungeon 69% vs 38% on tuning games, 50% vs 50% on held-out games: did not hold", lesson: "Second gain in a row that the held-out games erased."}
    - {name: "Key retry", switch: KEYRETRY, status: kept, result: "dungeon rooms 22 vs 19 over 16 games, nothing else moved"}
    - {name: "Clear the room when exits fail", switch: CLEAR, status: off, result: "KPI rerun: nothing clearly different, fewer places"}
    - {name: "Align on the tile after a refusal", switch: ALIGN2, status: off, result: "fixed one stuck game; 2nd item 2/16 vs 6/16"}
    - {name: "Align before every step", switch: ALIGN, status: rejected, result: "game overs 49 vs 25"}
    - {name: "Map flood from Link's whole body", status: kept, result: "one game 17 -> 46 places, others unchanged"}
    - {name: "Learned door kinds", switch: DOORKINDS, status: kept, result: "caves per game 1 -> 4-5, 2nd item 1/16 -> 6/16, first dungeon entered"}
    - {name: "Goals end on a screen change + cave fixes", status: kept, result: "25.3 -> 42.9 places (paired +17.6)", lesson: "Found by one capture each."}
    - {name: "Knockback no longer marks water", status: kept, result: "2-hop trips arriving 5% -> 32%"}
    - {name: "Edges = first new room of a goal", status: kept, result: "43 of 55 recorded edges were wrong before"}
    - {name: "Swing in place", switch: SWINGSTILL, status: kept, result: "game overs 43 -> 21, places unchanged", lesson: "Halving deaths did not add places: deaths were not the cap."}
    - {name: "Touch learning (old)", switch: TOUCH, status: off, result: "no effect"}
    - {name: "Avoid deadly screens", switch: AVOIDDEATH, status: rejected, result: "21.8 vs 25.5 places: those screens are hubs"}
    - {name: "Strike 2 tiles away", switch: REACH2, status: off, result: "KPI rerun: keys 44% vs 25%, dungeon 50% vs 38%, but 39.9 vs 46.2 places; all within noise"}
    - {name: "Frontier failure memory, untried exits first, keep taken exits", switch: "FRONTFAIL / FRONTUNTRIED", status: rejected, result: "4 frontier fixes in a row, no gain", lesson: "Then I measured travel itself and found the real bugs."}
    - {name: "Return to the frontier (Go-Explore from memory)", switch: FRONTIER2, status: kept, result: "Zelda 1 19.5 vs 13.9 places"}
    - {name: "Link's own tile never solid", status: kept, result: "20.0 -> 25.5 places"}
    - {name: "Novel-ground probe instead of a door label", status: kept, result: "removed the last Zelda 1 hand label"}
- phase: "Minish Cap, brain + hands (Nov 10)"
  items:
    - {name: "13 navigation hand rules", status: off, result: "all on: 5/12 and 2/12; all off: 10/12 and 11/12", lesson: "Each rule earns its place alone."}
    - {name: "Reflex calm", status: kept, result: "woods places 22 -> 206 (only rule that won forward selection)"}
    - {name: "Story guide from the local LLM", switch: GUIDE, status: off, result: "25/48 vs 27/48; its story knowledge contradicted itself"}
    - {name: "Last-resort form change", switch: LASTFORM, status: off, result: "neutral"}
    - {name: "Form-change reset", switch: FORMRESET, status: rejected, result: "barrel room 22/24 -> 6/24 (found by bisect)"}
    - {name: "Hand-tracing Minish Woods mechanics", status: dropped, result: "10 mechanics in a row, no measured gain", lesson: "I was the learner, one rule per mechanic."}
- phase: "Earlier approaches (Nov 7-10)"
  items:
    - {name: "PPO + Go-Explore with story rewards", status: dropped, result: "reached Deepwood, lever and slingshot by hand-made macros and RAM reading", lesson: "The real thinker was me reading the decomp."}
    - {name: "Simulator pretraining", status: dropped, result: "movement and survival transfer (rooms 45 -> 110 of 120, game overs 28 -> 6), puzzles at random (12 vs 8)"}
    - {name: "LLM experimenter on stalls (14B)", status: dropped, result: "62 experiments, 0 successes"}
    - {name: "Pixel cells", status: dropped, result: "cell explosion, fewer rooms"}
    - {name: "Vision model for objects", status: dropped, result: "invented coordinates; RAM things used instead"}
    - {name: "Learning which experiments pay (bandit)", status: dropped, result: "three tries, no gain"}
